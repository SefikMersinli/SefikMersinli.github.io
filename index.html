<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sefik Mersinli | Portfolyo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sefik Mersinli</h1>
        <button id="temaDegistir">Karanlık Mod</button>
        <nav>
            <a href="#hakkimda">Hakkımda</a>
            <a href="#yetenekler">Yetenekler</a>
            <a href="#projeler-bolumu">Projeler</a>
            <a href="#iletisim">İletişim</a>
        </nav>
    </header>

    <main>
        <!-- Hakkımda Bölümü -->
        <section id="hakkimda">
            <h2>Hakkımda</h2>
            <div id="github-profil">Yükleniyor...</div>
        </section>

        <!-- Yetenekler Bölümü -->
        <section id="yetenekler">
            <h2>Yeteneklerim</h2>
            <div class="yetenek-kapsayici">
                <p>HTML</p>
                <div class="bar-dis"><div class="bar-ic" style="width: 90%;">%90</div></div>
                <p>CSS</p>
                <div class="bar-dis"><div class="bar-ic" style="width: 85%;">%85</div></div>
                <p>JavaScript</p>
                <div class="bar-dis"><div class="bar-ic" style="width: 75%;">%75</div></div>
            </div>
        </section>

        <!-- Projeler Bölümü -->
        <section id="projeler-bolumu">
            <h2>Projelerim</h2>
            <div id="filtreler">
                <button onclick="projeleriFiltrele('hepsi')">Hepsi</button>
                <button onclick="projeleriFiltrele('web')">Web</button>
                <button onclick="projeleriFiltrele('mobil')">Mobil</button>
            </div>
            <!-- JavaScript burayı kullanarak kartları basacak -->
            <div id="projeAlani" class="grid-container"></div>
        </section>

        <!-- İletişim Bölümü -->
        <section id="iletisim">
            <h2>İletişim</h2>
            <p>Bana aşağıdaki kanallardan ulaşabilirsiniz:</p>
            <a href="mailto:email@adresin.com">E-Posta Gönder</a> | 
            <a href="https://github.com/SefikMersinli" target="_blank">GitHub Profilim</a>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; margin-top: 50px;">
        <p>&copy; 2026 Sefik Mersinli - Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- Script en altta, body kapanmadan hemen önce -->
    <script src="script.js"></script>
</body>
</html>
